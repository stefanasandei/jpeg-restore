# @package _global_
model_name: dimsum_rf
model:
  _target_: models.DiMSUMRectifiedFlow
  sample_steps: 50
  timestep_scale: 1000.0
  min_velocity_denom: 0.05
  time_logit_mean: -0.8
  time_logit_std: 0.8
  sampling_method: heun
  residual_scale: 16.0
  endpoint_loss_weight: 1.0
  dct_loss_weight: 0.1
  quality_loss_weight: 0.1
  wavelet_levels: 2
  out_channels: 3
  patch_size: 2
  patch_hidden_size: 96
  hidden_size: 384
  depth: 16
  num_heads: 8
  global_num_heads: 16
  state_size: 16
  convolution_size: 4
  expansion: 2
  mlp_ratio: 4.0
  global_attention_interval: 4

lr_scheduler:
  _target_: schedulers.warmup_cosine
  total_epochs: ${train.epochs}
  warmup_epochs: 5
  min_lr_ratio: 0.05
