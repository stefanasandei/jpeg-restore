# @package _global_
model_name: rela_dit_meanflow
model:
  _target_: models.MeanFlow
  sample_steps: 1
  timestep_scale: 1000.0
  min_time: 0.05
  time_logit_mean: 0.8
  time_logit_std: 0.8
  instantaneous_ratio: 0.5
  adaptive_power: 1.0
  adaptive_eps: 0.01
  lpips_weight: 0.2
  lpips_max_time: 0.8
  lpips_backbone: vgg
  quality_loss_weight: 0.1
  residual_scale: 16.0
  derivative_method: rcm

  model:
    _target_: models.LinearDiTPalette
    wavelet_levels: 2
    out_channels: 3
    patch_size: 2
    hidden_size: 576
    rearranged_patch_embed: true
    # Training uses a 16x16 token grid. Interpolate that coordinate domain
    # for larger evaluation/training crops instead of extrapolating it.
    positional_reference_size: 16
    depth: 16
    num_heads: 18
    mlp_ratio: 2.5
    linear_head_dim: 32

    rank_enhance_kernel: 5
    window_block_interval: 0
    use_cross_attention: false
    quality_split: 3
