defaults:
  - dimsum_rf_pretrain
  - _self_

# Exercise the exact pretrain model, checkpoint, data pipeline, objective, and
# optimizer step on one fixed batch before committing to a full training run.
train:
  compile:
    enabled: false

smoke:
  seed: 333
  batch_size: 1
  # Exercise the most visibly blocky end of the pretraining distribution.
  quality_factor: 10
  steps: 300
  # A fixed held-out bank measures whether the whole flow field improved.
  # Training itself resamples t and noise on every update, exactly as pretrain.
  probe_count: 16
  min_loss_reduction: 0.80
  prediction_seed: 333
  prediction_path: outputs/smoke_overfit_predictions.png
  min_psnr_gain: 0.0
  min_lpips_gain: 0.0
  min_boundary_gain: 0.0
  # Halve the JPEG input error and make at least half of the target-sized
  # correction, so a tiny identity-like adjustment cannot pass.
  max_mae_ratio: 0.5
  min_correction_ratio: 0.5
  log_every: 10
