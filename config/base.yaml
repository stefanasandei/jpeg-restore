defaults:
  - model: fbcnn
  - _self_

dataset:
  df2k_train: [/mnt/projects/models/01-datasets/DF2K/DF2K_train_HR]
  df2k_val: [/mnt/projects/models/01-datasets/DF2K/DF2K_valid_HR]
  urban100: [/mnt/projects/models/01-datasets/Urban100/data/data_*/img_*_SRF_2_HR.png]
  live1: [/mnt/projects/models/01-datasets/LIVE1]

train:
  datasets: [df2k_train]
  start_checkpoint: ""
  epochs: 200
  sample_every: 25
  lr: 3e-4
  batch_size: 32
  # /mnt/projects is a SATA device whose latency collapses under many parallel
  # random reads. Keep I/O queue depth low while all workers decode in parallel.
  read_concurrency: 2
  # Reset every validation epoch so stochastic restorations remain comparable.
  val_seed: 0
  scheduler:
    _target_: torch.optim.lr_scheduler.MultiStepLR
    milestones: [10, 30, 60, 90]
    gamma: 0.5

eval:
  datasets: [df2k_val]
  checkpoint: ""
  metrics: [psnr, ssim, lpips, dists, musiq, maniqa, clipiqa]
  metric_options:
    lpips:
      net_type: alex
    musiq:
      model_name: musiq
    maniqa:
      model_name: maniqa
    clipiqa:
      # Reuse the model reported by `hf cache ls` without network access.
      model_name: openai/clip-vit-base-patch16
      local_files_only: true
